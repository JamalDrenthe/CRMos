<!-- ========================================== -->
<!-- 1. FAVICONS & TOUCH ICONS                  -->
<!-- ========================================== -->
<!-- Oudere browsers & fallbacks -->
<link rel="icon" href="/favicon.ico" sizes="32x32">

<!-- Moderne browsers (schaalbare vector) -->
<link rel="icon" href="/favicon.svg" type="image/svg+xml">

<!-- Apple iOS apparaten (180x180, dekkende achtergrond) -->
<link rel="apple-touch-icon" href="/apple-touch-icon.png">

<!-- Android PWA & Web App Manifest -->
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="{{THEME_COLOR:-#FFFFFF}}">

<!-- ========================================== -->
<!-- 2. OPEN GRAPH (WhatsApp, LinkedIn, FB)    -->
<!-- ========================================== -->
<meta property="og:type" content="website">
<meta property="og:locale" content="{{LOCALE:-nl_NL}}">
<meta property="og:site_name" content="{{SITE_NAME}}">
<meta property="og:url" content="{{CANONICAL_URL}}">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESCRIPTION}}">
<meta property="og:image" content="{{OG_IMAGE_URL}}">
<meta property="og:image:secure_url" content="{{OG_IMAGE_URL}}">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{{LOGO_ALT:-Logo van Bedrijfsnaam}}">

<!-- ========================================== -->
<!-- 3. X (VOORHEEN TWITTER) CARD               -->
<!-- ========================================== -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{TITLE}}">
<meta name="twitter:description" content="{{DESCRIPTION}}">
<meta name="twitter:image" content="{{OG_IMAGE_URL}}">
<meta name="twitter:image:alt" content="{{LOGO_ALT:-Logo van Bedrijfsnaam}}">
